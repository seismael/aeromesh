[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeromesh-sdk"
version = "1.0.0"
description = "Embeddable Python SDK for AeroMesh: run declarative, signed, sandboxed agents via Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AeroMesh Contributors", email = "firas.ismael@gmail.com" }]
keywords = ["ai-agents", "declarative-agents", "agent-security", "deepagents", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aero>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/seismael/aeromesh"
Repository = "https://github.com/seismael/aeromesh"
Documentation = "https://github.com/seismael/aeromesh#readme"

[project.optional-dependencies]
dev = ["pytest"]
