[build-system]
requires = ["hatchling==1.32.4", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "aeromesh-sdk"
version = "1.0.0"
description = "Embeddable API for approved AeroMesh agent releases and workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AeroMesh Contributors", email = "firas.ismael@gmail.com" }]
keywords = ["ai-agents", "declarative-agents", "agent-security", "deepagents", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aero==1.0.0",
]

[project.urls]
Homepage = "https://github.com/seismael/aeromesh"
Repository = "https://github.com/seismael/aeromesh"
Documentation = "https://github.com/seismael/aeromesh#readme"

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/aeromesh"]
