[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeromesh-sdk"
version = "1.0.0"
description = "Embeddable Python SDK for AeroMesh Cognitive Kernel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aero>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]
