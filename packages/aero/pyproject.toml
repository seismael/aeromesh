[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aero"
version = "1.0.0"
description = "Aero Autonomous Agent Engine (AMX CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20.0",
    "rich>=13.7.0",
    "langgraph>=0.0.10",
    "psutil>=5.9.0",
]

[project.scripts]
amx = "aero.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aero"]
