[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aero"
version = "0.1.0"
description = "AeroMesh: a declarative, signed, sandboxed standard for AI agents, compiled into LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AeroMesh Contributors", email = "firas.ismael@gmail.com" }]
keywords = [
    "ai-agents",
    "agent-framework",
    "declarative-agents",
    "agent-security",
    "agent-marketplace",
    "llm",
    "langchain",
    "deepagents",
    "mcp",
    "ed25519",
    "agent-signing",
    "sandbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.20.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "deepagents>=0.6.0",
    "langchain>=1.0.0",
    "langchain-deepseek>=1.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/seismael/aeromesh"
Repository = "https://github.com/seismael/aeromesh"
Documentation = "https://github.com/seismael/aeromesh#readme"
Issues = "https://github.com/seismael/aeromesh/issues"

[project.scripts]
amx = "aero.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aero"]
