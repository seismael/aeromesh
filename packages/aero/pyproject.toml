[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aero"
version = "0.1.0"
description = "AeroMesh: declarative, signed, sandboxed agents compiled into Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "deepagents>=0.6.0",
    "langchain>=1.0.0",
    "langchain-deepseek>=1.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.3.0",
]

[project.scripts]
amx = "aero.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aero"]
